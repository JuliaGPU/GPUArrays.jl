# Tests of the GPU back-ends against this version of GPUArrays. The JLArray tests on GitHub
# Actions cover every supported Julia version, so the back-ends are only tested on the oldest
# and newest release. Draft pull requests skip them, unless selected by name in the last commit
# message: `[only cuda]`, `[only metal, oneapi]` or `[only tests]` for all of them. `[skip amdgpu]`
# or `[skip tests]` does the opposite.
steps:
  # Julia 1.10 doesn't support [sources] in Project.toml,
  # so we need to manually dev CUDA.jl's workspace packages.
  - label: "CUDA.jl -- Julia 1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    commands: |
      unset LD_LIBRARY_PATH
      julia .buildkite/sparse-v13-stack.jl CUDA
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120

  - label: "CUDA.jl -- Julia {{matrix.julia}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    commands: |
      unset LD_LIBRARY_PATH
      julia .buildkite/sparse-v13-stack.jl CUDA
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    matrix:
      setup:
        julia:
          - "1.13"

  - label: "AMDGPU.jl -- Julia {{matrix.julia}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia .buildkite/sparse-v13-stack.jl AMDGPU
    agents:
      queue: "rocm"
      rocmgpu: "*"
    if: |
      build.message !~ /\[skip [^\]]*(tests|amdgpu)/ &&
      (build.message =~ /\[only [^\]]*(tests|amdgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    matrix:
      setup:
        julia:
          - "1.10"
          - "1.13"

  - label: "oneAPI.jl -- Julia {{matrix.julia}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia .buildkite/sparse-v13-stack.jl oneAPI
    agents:
      queue: "oneapi"
    if: |
      build.message !~ /\[skip [^\]]*(tests|oneapi)/ &&
      (build.message =~ /\[only [^\]]*(tests|oneapi)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    matrix:
      setup:
        julia:
          - "1.10"
          - "1.13"

  - label: "OpenCL.jl -- NVIDIA GPU"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: julia .buildkite/sparse-v13-stack.jl OpenCL --platform=cuda --verbose
    agents:
      queue: "cuda"
    env:
      OCL_ICD_FILENAMES: "libnvidia-opencl.so.1"
    if: |
      build.message !~ /\[skip [^\]]*(tests|opencl)/ &&
      (build.message =~ /\[only [^\]]*(tests|opencl)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120

  - label: "Metal.jl -- Julia {{matrix.julia}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia .buildkite/sparse-v13-stack.jl Metal
    agents:
      queue: "metal"
    if: |
      build.message !~ /\[skip [^\]]*(tests|metal)/ &&
      (build.message =~ /\[only [^\]]*(tests|metal)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    matrix:
      setup:
        julia:
          - "1.10"
          - "1.13"

